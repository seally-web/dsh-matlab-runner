name: Feature request
description: Suggest an editor / runner / workspace feature
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should the panel do that it does not do today?
    validations:
      required: true
  - type: input
    id: today
    attributes:
      label: What you do instead right now
      placeholder: "e.g. I switch to MATLAB and drag the file there"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [editor, console, file tree, variables, figures, settings, agent tool, other]
